<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />

    <title>Readwise AI</title>

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/images/16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/180x180.png" />

    <!-- Primary Meta -->
    <meta name="description" content="Readwise AI — upload your books, search them by meaning, and get answers that cite the exact pages they come from." />
    <meta name="keywords" content="Readwise AI, book library, AI reading assistant, ask your books, semantic search, PDF books, cited answers" />
    <meta name="author" content="Readwise AI" />
    <meta name="theme-color" content="#F3F5F9" />
    <meta name="robots" content="index,follow" />
    <meta name="referrer" content="no-referrer" />

    <!-- Open Graph (add og:url / canonical once the app has a public domain) -->
    <meta property="og:site_name" content="Readwise AI" />
    <meta property="og:title" content="Readwise AI" />
    <meta property="og:description" content="Readwise AI — upload your books, search them by meaning, and get answers that cite the exact pages they come from." />
    <meta property="og:image" content="/images/thumbnail/share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:type" content="website" />

    <!-- Schema.org / itemprop -->
    <meta itemprop="name" content="Readwise AI" />
    <meta itemprop="description" content="Readwise AI — upload your books, search them by meaning, and get answers that cite the exact pages they come from." />
    <meta itemprop="image" content="/images/thumbnail/share.png" />
    <meta itemprop="author" content="Readwise AI" />
    <meta itemprop="publisher" content="Readwise AI" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Readwise AI" />
    <meta name="twitter:description" content="Readwise AI — upload your books, search them by meaning, and get answers that cite the exact pages they come from." />
    <meta name="twitter:image" content="/images/thumbnail/share.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@100..900&display=swap" rel="stylesheet" />

    <!-- Phosphor Icons (local CDN) -->
    <link rel="stylesheet" type="text/css" href="/cdn-assets/icons/@phosphor-icons/regular/style.css" />
    <link rel="stylesheet" type="text/css" href="/cdn-assets/icons/@phosphor-icons/thin/style.css" />
    <link rel="stylesheet" type="text/css" href="/cdn-assets/icons/@phosphor-icons/light/style.css" />
    <link rel="stylesheet" type="text/css" href="/cdn-assets/icons/@phosphor-icons/bold/style.css" />
    <link rel="stylesheet" type="text/css" href="/cdn-assets/icons/@phosphor-icons/fill/style.css" />
    <link rel="stylesheet" type="text/css" href="/cdn-assets/icons/@phosphor-icons/duotone/style.css" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
