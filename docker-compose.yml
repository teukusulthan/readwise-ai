# Local backing services for the RAG Book Library.
#
#   docker compose up -d          # start postgres, qdrant, mongo, redis
#   docker compose ps             # all services should become "healthy"
#
# Ports bind to 127.0.0.1 only. Postgres/Redis default to host ports 5433/6380 to avoid
# clashing with locally installed instances; override with POSTGRES_PORT / REDIS_PORT.
# Credentials default to local-dev values and can be overridden from the shell or a
# root .env (never commit real secrets).
#
# Application containers (backend, web, mcp) sit behind the `app` profile, so the command above
# still starts only the databases:
#   docker compose --profile app up -d --build
# They read git-ignored env files (apps/backend/.env, apps/web/env/.env, apps/mcp/library/.env; copy the
# .env.example next to each) and reach the databases by service name, which overrides the localhost
# values in those files. See README "Running with Docker".

name: library-rag

services:
  postgres:
    # pgvector image = plain PostgreSQL 16 + the vector extension (kept for the later pgvector evaluation).
    image: pgvector/pgvector:0.8.1-pg16-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-library}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-library}
      POSTGRES_DB: ${POSTGRES_DB:-library}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  qdrant:
    # Keep in step with qdrant-client in apps/backend/pyproject.toml (same minor version).
    image: qdrant/qdrant:v1.19.1
    environment:
      # Empty = no auth (local only). Set QDRANT_API_KEY and BE_QDRANT_API_KEY together outside local dev.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The image ships without curl/wget; probe the HTTP port with bash.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mongo:
    # Legacy boilerplate modules only (auth/user/group/permission/role/upload metadata).
    image: mongo:8.0.17
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    # Sessions, rate limiting, OTP storage.
    image: redis:7.4.7
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ---- application containers (profile `app`) ---------------------------------------------------

  backend:
    profiles: ["app"]
    build:
      context: ./apps/backend
    env_file:
      - path: ./apps/backend/.env
        required: false
    environment:
      # Service names replace the localhost values of the shared .env. Credentials follow the
      # POSTGRES_* defaults above; set POSTGRES_PASSWORD / QDRANT_API_KEY in the shell or a root .env.
      BE_POSTGRES_URI: postgresql://${POSTGRES_USER:-library}:${POSTGRES_PASSWORD:-library}@postgres:5432/${POSTGRES_DB:-library}
      BE_QDRANT_URL: http://qdrant:6333
      BE_QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      BE_MONGO_URI: mongodb://mongo:27017
      BE_REDIS_HOST: redis
      BE_REDIS_PORT: "6379"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8020}:8020"
    volumes:
      - book-storage:/app/storage
      - hf-cache:/home/app/.cache/huggingface
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  web:
    profiles: ["app"]
    build:
      context: ./apps/web
      args:
        # Compiled into the bundle at build time (rebuild after changing them).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_AUTH_ENABLED: ${VITE_AUTH_ENABLED:-false}
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
    env_file:
      # Runtime: ICON_CDN_PROXY_TARGET (the icon CDN host, never committed). Unset = /cdn-assets/ answers 404.
      - path: ./apps/web/env/.env
        required: false
    environment:
      BACKEND_UPSTREAM: http://backend:8020
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:8080"
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mcp:
    profiles: ["app"]
    build:
      context: ./apps/mcp/library
    env_file:
      - path: ./apps/mcp/library/.env
        required: false
    environment:
      # MCP_BEARER_TOKEN (>= 32 chars) and LIBRARY_INTERNAL_TOKEN (= the backend's BE_INTERNAL_TOKEN)
      # come from the env file; the container refuses to start without a bearer token.
      LIBRARY_API_URL: http://backend:8020
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8030"
    ports:
      - "127.0.0.1:${MCP_PORT:-8030}:8030"
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; socket.create_connection(('127.0.0.1', 8030), timeout=4).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  book-storage:
  hf-cache:
  postgres-data:
  qdrant-data:
  mongo-data:
  redis-data:
