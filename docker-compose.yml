# Local backing services for the RAG Book Library.
#
#   docker compose up -d          # start postgres, qdrant, mongo, redis
#   docker compose ps             # all services should become "healthy"
#
# Ports bind to 127.0.0.1 only. Postgres/Redis default to host ports 5433/6380 to avoid
# clashing with locally installed instances; override with POSTGRES_PORT / REDIS_PORT.
# Credentials default to local-dev values and can be overridden from the shell or a
# root .env (never commit real secrets).
# Application containers (backend, web, mcp) are added in the Docker phase.

name: library-rag

services:
  postgres:
    # pgvector image = plain PostgreSQL 16 + the vector extension (kept for the later pgvector evaluation).
    image: pgvector/pgvector:0.8.1-pg16-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-library}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-library}
      POSTGRES_DB: ${POSTGRES_DB:-library}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  qdrant:
    # Keep in step with qdrant-client in apps/backend/pyproject.toml (same minor version).
    image: qdrant/qdrant:v1.19.1
    environment:
      # Empty = no auth (local only). Set QDRANT_API_KEY and BE_QDRANT_API_KEY together outside local dev.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The image ships without curl/wget; probe the HTTP port with bash.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mongo:
    # Legacy boilerplate modules only (auth/user/group/permission/role/upload metadata).
    image: mongo:8.0.17
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    # Sessions, rate limiting, OTP storage.
    image: redis:7.4.7
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  qdrant-data:
  mongo-data:
  redis-data:
